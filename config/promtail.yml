server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Tenant for a container with no owning organization, which no organization
    # can address. The tenant stage below overrides it per entry.
    tenant_id: vardo.unassigned

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Resolve managed flag — vardo.managed takes priority, fall back to host.managed (legacy)
      - source_labels: ["__meta_docker_container_label_host_managed"]
        target_label: __tmp_managed
      - source_labels: ["__meta_docker_container_label_vardo_managed"]
        regex: "(.+)"
        target_label: __tmp_managed
      # Only scrape containers where managed=true
      - source_labels: ["__tmp_managed"]
        regex: "true"
        action: keep
      # Extract organization label — the Loki tenant, set below in pipeline_stages
      - source_labels: ["__meta_docker_container_label_host_organization"]
        target_label: organization
      - source_labels: ["__meta_docker_container_label_vardo_organization"]
        regex: "(.+)"
        target_label: organization
      # Extract project label — vardo.project takes priority, fall back to host.project
      - source_labels: ["__meta_docker_container_label_host_project"]
        target_label: project
      - source_labels: ["__meta_docker_container_label_vardo_project"]
        regex: "(.+)"
        target_label: project
      # Extract project_id label — vardo.project.id takes priority, fall back to host.project.id
      - source_labels: ["__meta_docker_container_label_host_project_id"]
        target_label: project_id
      - source_labels: ["__meta_docker_container_label_vardo_project_id"]
        regex: "(.+)"
        target_label: project_id
      # Extract environment label — vardo.environment takes priority, fall back to host.environment
      - source_labels: ["__meta_docker_container_label_host_environment"]
        target_label: environment
      - source_labels: ["__meta_docker_container_label_vardo_environment"]
        regex: "(.+)"
        target_label: environment
      # Compose metadata
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
    # Loki is tenanted by organization. A relabel to __tenant_id__ would not
    # survive — the docker target strips every __-prefixed label before the
    # push — so the tenant is set from the label here.
    pipeline_stages:
      - tenant:
          label: organization
