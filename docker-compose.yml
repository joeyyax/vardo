name: vardo

# Single compose file for all environments.
#
#   Dev:    docker compose up -d
#           App container skipped (no production profile). Run the app with `pnpm dev`.
#
#   Prod:   docker compose up -d
#           install.sh sets COMPOSE_PROFILES=production — all services start.
#
# Optional infrastructure (the collector, Loki, Promtail) is deployed as managed apps
# by Vardo itself when the corresponding feature flags are enabled.

services:
  frontend:
    container_name: vardo-frontend
    build:
      context: .
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: https://${VARDO_DOMAIN:-localhost}
        NEXT_PUBLIC_APP_URL: https://${VARDO_DOMAIN:-localhost}
        # The engine sets VARDO_GIT_SHORT_SHA; install.sh exports GIT_SHA.
        GIT_SHA: ${VARDO_GIT_SHORT_SHA:-${GIT_SHA:-}}
    profiles:
      - production
    restart: unless-stopped
    mem_limit: ${VARDO_FRONTEND_MEM:-2g}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://host:${DB_PASSWORD:?Set DB_PASSWORD in .env}@vardo-postgres:5432/host
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@vardo-redis:6379
      NEXT_PUBLIC_BETTER_AUTH_URL: https://${VARDO_DOMAIN:-localhost}
      NEXT_PUBLIC_APP_URL: https://${VARDO_DOMAIN:-localhost}
      VARDO_HOME_DIR: ${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}
      # The collector and Loki are on vardo-monitoring, which the console joins at startup.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      TRAEFIK_URL: ${TRAEFIK_URL:-http://vardo-traefik:8080}
      WIREGUARD_GATEWAY: 10.88.0.2
      DOCKER_GID: ${DOCKER_GID:-999}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      # Without this the first check waits the full 30s interval, so every
      # deploy reports healthy ~25s after it already is.
      start_interval: 2s
    cap_add:
      - NET_ADMIN
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      # Docker socket — required for the deploy engine and admin restart endpoint.
      # Accepted risk: mounting the socket grants this container full control over
      # the host daemon. Mitigated by admin-only auth, non-root user, and docker GID mapping.
      # Set CONTAINER_ID in .env if you run Vardo with a custom container hostname.
      - /var/run/docker.sock:/var/run/docker.sock
      # Vardo home directory — all app data, traefik config, and images live here.
      # Mounted read-write for deploys, .env writes, and self-updates.
      - ${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}:${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}
      # Additional host mounts — pre-defined slots for mounting host paths into Vardo.
      # Set VARDO_DATA or VARDO_PROJECTS in .env to enable. Unused slots default to /dev/null (no-op).
      # Each mount is a source:destination:ro pair (e.g., /mnt/data:/var/lib/vardo/data:ro).
      - ${VARDO_DATA:-/dev/null:/dev/null:ro}
      - ${VARDO_PROJECTS:-/dev/null:/dev/null:ro}
      - ${VARDO_MOUNT_1:-/dev/null:/dev/null:ro}
      - ${VARDO_MOUNT_2:-/dev/null:/dev/null:ro}
      # Host /proc, read-only: listening ports, host mounts and boot time.
      - /proc:/host-proc:ro
      # Host cgroup root — read-only mount for OOM kill counts.
      # The container's own /sys/fs/cgroup is namespaced to itself and always reads zero.
      - /sys/fs/cgroup:/host-cgroup:ro
      # Traefik dynamic config — shared volume for file-provider route configs.
      # Frontend writes YAML files here; Traefik watches and reloads automatically.
      - traefik_dynamic:/etc/traefik/dynamic:rw
    labels:
      # Routers below are hand-written — this stops a deploy replacing them.
      - "vardo.traefik=manual"
      - "traefik.enable=true"
      # Primary router — domain with TLS
      - "traefik.http.routers.vardo.rule=Host(`${VARDO_DOMAIN:-localhost}`)"
      - "traefik.http.routers.vardo.entrypoints=websecure"
      - "traefik.http.routers.vardo.tls.certresolver=${VARDO_CONSOLE_CERT_RESOLVER:-le}"
      # Console lock (docs/console-lock.md). Empty means none; /api/health and the GitHub webhook bypass it.
      - "traefik.http.routers.vardo.middlewares=${VARDO_CONSOLE_MIDDLEWARES:-}"
      - "traefik.http.services.vardo.loadbalancer.server.port=3000"
      # HTTP→HTTPS redirect for the domain (not for IP)
      - "traefik.http.routers.vardo-http.rule=Host(`${VARDO_DOMAIN:-localhost}`)"
      - "traefik.http.routers.vardo-http.entrypoints=web"
      - "traefik.http.routers.vardo-http.middlewares=vardo-https-redirect"
      - "traefik.http.middlewares.vardo-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.vardo-https-redirect.redirectscheme.permanent=true"
      # Fallback routers — catch-all for IP access (setup before DNS)
      - "traefik.http.routers.vardo-fallback.rule=PathPrefix(`/`)"
      - "traefik.http.routers.vardo-fallback.entrypoints=web"
      - "traefik.http.routers.vardo-fallback.priority=1"
      - "traefik.http.routers.vardo-fallback.service=vardo"
      - "traefik.http.routers.vardo-fallback.middlewares=${VARDO_CONSOLE_MIDDLEWARES:-}"
      # HTTPS fallback — self-signed cert (Traefik default), user accepts warning
      - "traefik.http.routers.vardo-fallback-https.rule=PathPrefix(`/`)"
      - "traefik.http.routers.vardo-fallback-https.entrypoints=websecure"
      - "traefik.http.routers.vardo-fallback-https.priority=1"
      - "traefik.http.routers.vardo-fallback-https.tls=true"
      - "traefik.http.routers.vardo-fallback-https.service=vardo"
      - "traefik.http.routers.vardo-fallback-https.middlewares=${VARDO_CONSOLE_MIDDLEWARES:-}"
      # Unknown-host assets — serve /_next without path rewrite so CSS/JS loads correctly
      - "traefik.http.routers.vardo-unknown-host-assets.rule=HostRegexp(`.*[a-zA-Z].*`) && PathPrefix(`/_next`)"
      - "traefik.http.routers.vardo-unknown-host-assets.entrypoints=websecure"
      - "traefik.http.routers.vardo-unknown-host-assets.tls=true"
      - "traefik.http.routers.vardo-unknown-host-assets.priority=3"
      - "traefik.http.routers.vardo-unknown-host-assets.service=vardo"
      - "traefik.http.routers.vardo-unknown-host-assets-http.rule=HostRegexp(`.*[a-zA-Z].*`) && PathPrefix(`/_next`)"
      - "traefik.http.routers.vardo-unknown-host-assets-http.entrypoints=web"
      - "traefik.http.routers.vardo-unknown-host-assets-http.priority=3"
      - "traefik.http.routers.vardo-unknown-host-assets-http.service=vardo"
      # Unknown-host router — catches unrecognized hostnames and shows service-not-found page
      # Regex requires at least one letter, so raw IP access falls through to vardo-fallback-https
      - "traefik.http.routers.vardo-unknown-host.rule=HostRegexp(`.*[a-zA-Z].*`)"
      - "traefik.http.routers.vardo-unknown-host.entrypoints=websecure"
      - "traefik.http.routers.vardo-unknown-host.tls=true"
      - "traefik.http.routers.vardo-unknown-host.priority=2"
      - "traefik.http.routers.vardo-unknown-host.service=vardo"
      - "traefik.http.routers.vardo-unknown-host.middlewares=vardo-unknown-host-path"
      - "traefik.http.middlewares.vardo-unknown-host-path.replacepathregex.regex=^/.*$$"
      - "traefik.http.middlewares.vardo-unknown-host-path.replacepathregex.replacement=/unknown-host"
      # Unknown-host router (HTTP) — mirrors HTTPS behavior on port 80 for unknown hostnames
      - "traefik.http.routers.vardo-unknown-host-http.rule=HostRegexp(`.*[a-zA-Z].*`)"
      - "traefik.http.routers.vardo-unknown-host-http.entrypoints=web"
      - "traefik.http.routers.vardo-unknown-host-http.priority=2"
      - "traefik.http.routers.vardo-unknown-host-http.service=vardo"
      - "traefik.http.routers.vardo-unknown-host-http.middlewares=vardo-unknown-host-path"
    networks:
      internal:
      mesh:
        ipv4_address: 10.88.0.3
      vardo-network:

  # Background loops (worker/index.ts), from the frontend's image. Rotates with the console's slot.
  # Env, mounts and networks match frontend; tests/unit/infra/worker-compose.test.ts keeps them in step.
  worker:
    image: ${COMPOSE_PROJECT_NAME}-frontend
    pull_policy: never
    command: ["worker"]
    profiles:
      - production
    restart: unless-stopped
    mem_limit: ${VARDO_WORKER_MEM:-1g}
    # Covers VARDO_WORKER_DRAIN_SECONDS (9 min) plus releasing leases.
    stop_grace_period: ${VARDO_WORKER_STOP_GRACE:-10m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://host:${DB_PASSWORD:?Set DB_PASSWORD in .env}@vardo-postgres:5432/host
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@vardo-redis:6379
      NEXT_PUBLIC_BETTER_AUTH_URL: https://${VARDO_DOMAIN:-localhost}
      NEXT_PUBLIC_APP_URL: https://${VARDO_DOMAIN:-localhost}
      VARDO_HOME_DIR: ${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      TRAEFIK_URL: ${TRAEFIK_URL:-http://vardo-traefik:8080}
      WIREGUARD_GATEWAY: 10.88.0.2
      DOCKER_GID: ${DOCKER_GID:-999}
      VARDO_WORKER_HEALTH_PORT: 3001
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Waits for the frontend's migrations before it reports healthy.
      start_period: 120s
      start_interval: 2s
    cap_add:
      - NET_ADMIN
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}:${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}
      - ${VARDO_DATA:-/dev/null:/dev/null:ro}
      - ${VARDO_PROJECTS:-/dev/null:/dev/null:ro}
      - ${VARDO_MOUNT_1:-/dev/null:/dev/null:ro}
      - ${VARDO_MOUNT_2:-/dev/null:/dev/null:ro}
      - /proc:/host-proc:ro
      - /sys/fs/cgroup:/host-cgroup:ro
      - traefik_dynamic:/etc/traefik/dynamic:rw
    networks:
      internal:
      mesh:
      vardo-network:

  postgres:
    container_name: vardo-postgres
    x-vardo-shared: true
    image: postgres:17
    restart: unless-stopped
    # Fast shutdown writes a checkpoint; Docker's 10s default can cut it off.
    stop_grace_period: 120s
    mem_limit: ${VARDO_POSTGRES_MEM:-1g}
    environment:
      POSTGRES_USER: host
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: host
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-7100}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U host"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    container_name: vardo-redis
    x-vardo-shared: true
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    # Final AOF/RDB write on stop; the wrapper makes SIGTERM reach redis-server.
    stop_grace_period: 60s
    entrypoint: ["/usr/bin/dumb-init", "/bin/sh", "/usr/local/bin/vardo-redis-entrypoint"]
    mem_limit: ${VARDO_REDIS_MEM:-512m}
    environment:
      # Unset on installs from before #889, which keep running without a password.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # install.sh sizes both from RAM. Keep maxmemory about 62% of VARDO_REDIS_MEM: AOF rewrites and snapshots fork, and writes during a fork copy pages (at 75% a write burst OOM-killed the container). volatile-lru never evicts queues, streams or time series.
      # Hourly snapshots back up the AOF (redis-entrypoint.sh falls back to them). Don't quote the save value: REDIS_ARGS is word-split and quotes make Redis refuse to start.
      REDIS_ARGS: --appendonly yes --appendfsync everysec --save 3600 1 --maxmemory ${VARDO_REDIS_MAXMEMORY:-320mb} --maxmemory-policy volatile-lru${REDIS_PASSWORD:+ --requirepass ${REDIS_PASSWORD}}
    ports:
      - "127.0.0.1:${REDIS_PORT:-7200}:6379"
    volumes:
      - redis_data:/data
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/vardo-redis-entrypoint:ro
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # Railpack builds through BuildKit rather than the Docker daemon, so a
  # railpack deploy needs this running. Dockerfile and compose builds use it
  # too when it is up, so they run under its memory limit. Opt in with `buildkit` in
  # COMPOSE_PROFILES — it is privileged, which should be a deliberate choice
  # rather than something every install inherits. Nixpacks does not need it.
  buildkit:
    container_name: vardo-buildkit
    x-vardo-shared: true
    image: moby/buildkit:v0.34.0
    profiles:
      - buildkit
    restart: unless-stopped
    privileged: true
    # Every build runs here when this profile is on, so this bounds them all.
    # install.sh sets it to a quarter of RAM.
    mem_limit: ${VARDO_BUILDKIT_MEM:-4g}
    # No swap, except autosize gives hosts under 6 GiB swap equal to memory.
    memswap_limit: ${VARDO_BUILDKIT_MEM:-4g}
    environment:
      # buildkitd grows with each build and never gives it back.
      GOMEMLIMIT: 600MiB
    healthcheck:
      test: ["CMD", "buildctl", "debug", "workers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - buildkit_data:/var/lib/buildkit
    configs:
      - source: buildkitd
        target: /etc/buildkit/buildkitd.toml
    # Build steps share this network; keep it apart from Postgres and Redis. The console reaches it through Docker.
    networks:
      - builds

  traefik:
    container_name: vardo-traefik
    x-vardo-shared: true
    image: traefik:v3.7
    restart: unless-stopped
    # Sized from RAM/32, between 512m and 2g. If it's killed, every site goes down.
    mem_limit: ${VARDO_TRAEFIK_MEM:-512m}
    command:
      # The API answers only through the console's basic-auth router (vardo-api.yaml) on this entrypoint.
      - "--api=true"
      - "--entrypoints.traefik.address=:8080"
      # Prometheus metrics on vardo-traefik:8082, never published or routed. Off unless VARDO_TRAEFIK_METRICS=true.
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=${VARDO_TRAEFIK_METRICS:-false}"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${TRAEFIK_DOCKER_NETWORK-vardo-network}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      # Whole-request limit, headers included. Raising it lets slow clients hold every HTTPS route open that long.
      - "--entrypoints.websecure.transport.respondingtimeouts.readtimeout=${VARDO_TRAEFIK_READ_TIMEOUT:-60s}"
      # Cloudflare's ranges plus VARDO_TRUSTED_PROXIES, kept current by the console (lib/docker/trusted-proxies.ts). VARDO_TRUST_CLOUDFLARE=false drops Cloudflare's.
      - "--entrypoints.web.forwardedheaders.trustedips=${VARDO_TRAEFIK_TRUSTED_IPS-173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32}"
      - "--entrypoints.websecure.forwardedheaders.trustedips=${VARDO_TRAEFIK_TRUSTED_IPS-173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32}"
      # Let's Encrypt (default, always available)
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme-le.json"
      # Let's Encrypt — DNS-01 challenge (Cloudflare; requires CF_DNS_API_TOKEN)
      - "--certificatesresolvers.le-dns.acme.dnschallenge=true"
      - "--certificatesresolvers.le-dns.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le-dns.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.le-dns.acme.storage=/letsencrypt/acme-le-dns.json"
      # Google Trust Services (free, no EAB required)
      - "--certificatesresolvers.google.acme.tlschallenge=true"
      - "--certificatesresolvers.google.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.google.acme.caserver=https://dv.acme-v02.api.pki.goog/directory"
      - "--certificatesresolvers.google.acme.storage=/letsencrypt/acme-google.json"
      # Google Trust Services — DNS-01 challenge (Cloudflare; requires CF_DNS_API_TOKEN)
      - "--certificatesresolvers.google-dns.acme.dnschallenge=true"
      - "--certificatesresolvers.google-dns.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.google-dns.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.google-dns.acme.caserver=https://dv.acme-v02.api.pki.goog/directory"
      - "--certificatesresolvers.google-dns.acme.storage=/letsencrypt/acme-google-dns.json"
      # ZeroSSL (requires EAB credentials — non-functional until configured)
      - "--certificatesresolvers.zerossl.acme.tlschallenge=true"
      - "--certificatesresolvers.zerossl.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.zerossl.acme.caserver=https://acme.zerossl.com/v2/DV90"
      - "--certificatesresolvers.zerossl.acme.eab.kid=${ZEROSSL_EAB_KID:-}"
      - "--certificatesresolvers.zerossl.acme.eab.hmacencoded=${ZEROSSL_EAB_HMAC:-}"
      - "--certificatesresolvers.zerossl.acme.storage=/letsencrypt/acme-zerossl.json"
      # ZeroSSL — DNS-01 challenge (Cloudflare; requires CF_DNS_API_TOKEN + EAB credentials)
      - "--certificatesresolvers.zerossl-dns.acme.dnschallenge=true"
      - "--certificatesresolvers.zerossl-dns.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.zerossl-dns.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.zerossl-dns.acme.caserver=https://acme.zerossl.com/v2/DV90"
      - "--certificatesresolvers.zerossl-dns.acme.eab.kid=${ZEROSSL_EAB_KID:-}"
      - "--certificatesresolvers.zerossl-dns.acme.eab.hmacencoded=${ZEROSSL_EAB_HMAC:-}"
      - "--certificatesresolvers.zerossl-dns.acme.storage=/letsencrypt/acme-zerossl-dns.json"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Serves /ping on the traefik entrypoint for the healthcheck below.
      - "--ping=true"
    environment:
      # Required for DNS-01 challenge with Cloudflare. Set in .env when using DNS challenge.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      # 90% of mem_limit by default; can be overridden in .env.
      GOMEMLIMIT: ${VARDO_TRAEFIK_GOMEMLIMIT:-460MiB}
    healthcheck:
      # Distroless image — no shell and no curl, so the probe is Traefik's own subcommand.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik_dynamic:/etc/traefik/dynamic
    networks:
      - vardo-network


  wireguard:
    container_name: vardo-wireguard
    x-vardo-shared: true
    image: linuxserver/wireguard:1.0.20260223-r0-ls119
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      # SYS_MODULE needed on kernels without wireguard built in (pre-5.6).
      # Safe to remove on Ubuntu 20.04+, Debian 11+, modern Docker Desktop.
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "${WIREGUARD_PORT:-51820}:51820/udp"
    volumes:
      - wireguard_config:/config
    healthcheck:
      # Healthy with no wg0.conf: the console writes it, so a fresh install would never start.
      test: ["CMD-SHELL", "[ ! -f /config/wg_confs/wg0.conf ] || wg show wg0 2>/dev/null | grep -q 'interface'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      internal:
      mesh:
        ipv4_address: 10.88.0.2
      vardo-network:
    mem_limit: 64m

  # Rootless BuildKit that linked instances' builds run in, reached only through vardo-wireguard's DNAT with a client certificate per peer.
  mesh-builder:
    container_name: vardo-mesh-builder
    x-vardo-shared: true
    image: moby/buildkit:v0.34.0-rootless
    profiles:
      - production
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/vardo-mesh-builder"]
    # The console resizes it like vardo-buildkit unless VARDO_MESH_BUILDER_MEM pins it.
    mem_limit: ${VARDO_MESH_BUILDER_MEM:-${VARDO_BUILDKIT_MEM:-4g}}
    memswap_limit: ${VARDO_MESH_BUILDER_MEM:-${VARDO_BUILDKIT_MEM:-4g}}
    cpus: ${VARDO_MESH_BUILDER_CPUS:-2}
    pids_limit: 4096
    # rootlesskit needs unshare and mount for its user namespace, and an unmasked /proc to sandbox each build's processes from buildkitd.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    environment:
      GOMEMLIMIT: 600MiB
      VARDO_MESH_BUILDER_PORT: ${VARDO_MESH_BUILDER_PORT:-1234}
    healthcheck:
      # Healthy while it waits for the console to write its TLS files.
      test: ["CMD-SHELL", "[ ! -s /home/user/.local/share/buildkit/vardo-tls/ca.pem ] || netstat -ltn | grep -q \":$${VARDO_MESH_BUILDER_PORT:-1234} \""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # Build cache, and the TLS files the console writes into vardo-tls.
      - mesh_builder:/home/user/.local/share/buildkit
    configs:
      - source: mesh_builder_entrypoint
        target: /usr/local/bin/vardo-mesh-builder
      - source: buildkitd
        target: /home/user/.config/buildkit/buildkitd.toml
    networks:
      - mesh

  # Restarts the console, Traefik, Postgres and Redis when Docker reports them unhealthy (docs/watchdog.md).
  watchdog:
    container_name: vardo-watchdog
    x-vardo-shared: true
    image: docker:28.5.1-cli
    profiles:
      - production
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: ["sh", "/usr/local/bin/vardo-watchdog"]
    environment:
      VARDO_WATCHDOG: ${VARDO_WATCHDOG:-true}
      # Changes every release, so a deploy recreates this on the new script.
      VARDO_WATCHDOG_REV: ${VARDO_GIT_SHORT_SHA:-local}
    volumes:
      # Inspect, exec into Redis for the deploy lease, and restart.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/watchdog.sh:/usr/local/bin/vardo-watchdog:ro
      - ${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}/apps/vardo:/vardo-app:ro
      # Restart history and events.log, which the console surfaces as alerts.
      - ${VARDO_HOME_DIR:-${VARDO_DIR:-/opt/vardo}}/watchdog:/state
    network_mode: none

# Caps BuildKit's cache. VARDO_BUILDKIT_CACHE_MAX is bytes or a size with a unit
# ("20GB" is binary, 20 GiB); install.sh sets it from the disk size.
# Policies run in order: layers unused for 7 days go first, then anything least recently used.
configs:
  buildkitd:
    content: |
      [worker.oci]
        gc = true
        [[worker.oci.gcpolicy]]
          all = true
          filters = ["type!=exec.cachemount"]
          keepDuration = "168h"
          maxUsedSpace = "${VARDO_BUILDKIT_CACHE_MAX:-10737418240}"
          minFreeSpace = "5000000000"
        [[worker.oci.gcpolicy]]
          all = true
          reservedSpace = "1000000000"
          maxUsedSpace = "${VARDO_BUILDKIT_CACHE_MAX:-10737418240}"
          minFreeSpace = "5000000000"

  # Waits for the console's TLS files, then serves BuildKit over mutual TLS only.
  mesh_builder_entrypoint:
    content: |
      #!/bin/sh
      set -eu
      port="$${VARDO_MESH_BUILDER_PORT:-1234}"
      dir=/home/user/.local/share/buildkit/vardo-tls
      until [ -s "$$dir/ca.pem" ] && [ -s "$$dir/cert.pem" ] && [ -s "$$dir/key.pem" ]; do sleep 5; done
      exec rootlesskit buildkitd --addr "tcp://0.0.0.0:$$port" --tlscacert "$$dir/ca.pem" --tlscert "$$dir/cert.pem" --tlskey "$$dir/key.pem" --config /home/user/.config/buildkit/buildkitd.toml

volumes:
  postgres_data:
  redis_data:
  buildkit_data:
  letsencrypt:
  wireguard_config:
  traefik_dynamic:
  mesh_builder:

networks:
  internal:
  builds:
  mesh:
    ipam:
      config:
        - subnet: 10.88.0.0/24
  vardo-network:
    external: true
