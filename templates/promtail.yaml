version: "1"
name: promtail
displayName: Promtail
description: Log shipper that discovers Docker containers and pushes logs to Loki.
icon: https://cdn.simpleicons.org/grafana
category: monitoring
source: direct
deployType: compose

composeContent: |
  services:
    promtail:
      image: grafana/promtail:3.4
      restart: unless-stopped
      command:
        - -config.file=/etc/promtail/config.yml
      configs:
        - source: promtail-config
          target: /etc/promtail/config.yml
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Scales with the number of containers discovered on the host.
      mem_limit: 256m
      # Promtail pushes to http://loki:3100 and Loki lives in its own compose
      # project. Without the shared network the push has nowhere to land.
      networks:
        - vardo-network

  networks:
    vardo-network:
      external: true

  configs:
    promtail-config:
      content: |
        server:
          http_listen_port: 9080
        positions:
          filename: /tmp/positions.yaml
        clients:
          - url: http://loki:3100/loki/api/v1/push
            # Tenant for a container with no owning organization, which no
            # organization can address. The tenant stage below overrides it
            # per entry for containers that have one.
            tenant_id: vardo.unassigned
        scrape_configs:
          - job_name: docker
            docker_sd_configs:
              - host: unix:///var/run/docker.sock
                refresh_interval: 5s
            relabel_configs:
              - source_labels: ["__meta_docker_container_label_host_managed"]
                target_label: __tmp_managed
              - source_labels: ["__meta_docker_container_label_vardo_managed"]
                regex: "(.+)"
                target_label: __tmp_managed
              - source_labels: ["__tmp_managed"]
                regex: "true"
                action: keep
              - source_labels: ["__meta_docker_container_label_host_organization"]
                target_label: organization
              - source_labels: ["__meta_docker_container_label_vardo_organization"]
                regex: "(.+)"
                target_label: organization
              - source_labels: ["__meta_docker_container_label_host_project"]
                target_label: project
              - source_labels: ["__meta_docker_container_label_vardo_project"]
                regex: "(.+)"
                target_label: project
              - source_labels: ["__meta_docker_container_label_host_project_id"]
                target_label: project_id
              - source_labels: ["__meta_docker_container_label_vardo_project_id"]
                regex: "(.+)"
                target_label: project_id
              - source_labels: ["__meta_docker_container_label_host_environment"]
                target_label: environment
              - source_labels: ["__meta_docker_container_label_vardo_environment"]
                regex: "(.+)"
                target_label: environment
              - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
                target_label: service
              - source_labels: ["__meta_docker_container_name"]
                regex: "/(.*)"
                target_label: container
            # Loki is tenanted by organization. A relabel to __tenant_id__ would
            # not survive — the docker target strips every __-prefixed label
            # before the push — so the tenant is set from the label here.
            pipeline_stages:
              - tenant:
                  label: organization
