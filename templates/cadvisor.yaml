version: "1"
name: cadvisor
displayName: cAdvisor
description: Container resource metrics (CPU, memory, network, disk). Connect as a Vardo metrics integration.
icon: https://cdn.simpleicons.org/google/4285F4
category: monitoring
source: direct
deployType: compose
defaultPort: 8080

composeContent: |
  services:
    cadvisor:
      image: gcr.io/cadvisor/cadvisor:latest
      restart: unless-stopped
      privileged: true
      command:
        - --housekeeping_interval=30s
        - --disable_metrics=disk,diskIO,udp,percpu
        - --docker_only=true
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
      mem_limit: 256m
      # Vardo reaches this at http://cadvisor:8080. Without joining the shared
      # network the container is unreachable and metrics silently never arrive.
      networks:
        - vardo-network

  networks:
    vardo-network:
      external: true
