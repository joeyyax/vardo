version: "1"
name: cadvisor
displayName: cAdvisor
description: Container resource metrics (CPU, memory, network, disk). Connect as a Vardo metrics integration.
icon: https://cdn.simpleicons.org/google/4285F4
category: monitoring
source: direct
deployType: compose
defaultPort: 8080

composeContent: |
  services:
    cadvisor:
      # Pinned. Bump deliberately — do not revert to :latest.
      image: gcr.io/cadvisor/cadvisor:v0.55.1
      restart: unless-stopped
      privileged: true
      command:
        - --housekeeping_interval=30s
        # cAdvisor's own default disable list plus percpu. Setting this flag
        # replaces that default, so the expensive /proc scanners must be named.
        - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
        - --docker_only=true
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
      # Disk metrics walk every container's filesystem, so this is not 256m.
      mem_limit: 512m
      # Vardo reaches this at http://cadvisor:8080. Without joining the shared
      # network the container is unreachable and metrics silently never arrive.
      networks:
        - vardo-network

  networks:
    vardo-network:
      external: true
