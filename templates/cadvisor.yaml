version: "1"
name: cadvisor
displayName: cAdvisor
description: Container resource metrics (CPU, memory, network). Connect as a Vardo metrics integration.
icon: https://cdn.simpleicons.org/google/4285F4
category: monitoring
source: direct
deployType: compose
defaultPort: 8080

composeContent: |
  services:
    cadvisor:
      # Pinned. Bump deliberately — do not revert to :latest.
      image: gcr.io/cadvisor/cadvisor:v0.55.1
      restart: unless-stopped
      privileged: true
      command:
        - --housekeeping_interval=30s
        # Setting this flag replaces cAdvisor's default list, so the expensive
        # scanners are named. Vardo reads cpu, memory, network and diskIO only;
        # `disk` duplicates /system/df and walks every container filesystem.
        - --disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,hugetlb,memory_numa,oom_event,percpu,pressure,process,referenced_memory,resctrl,sched,tcp,udp,disk
        - --docker_only=true
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
      # 512m with disk metrics on (Core services toggle).
      mem_limit: 256m
      # Vardo reaches this at http://cadvisor:8080 on the console-only monitoring network.
      networks:
        - vardo-monitoring

  networks:
    vardo-monitoring:
      external: true
